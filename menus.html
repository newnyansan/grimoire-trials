<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grimoire Trials</title>
<style>
:root{--bg:#14121c;--panel:#1f1c2b;--ink:#ece8f5;--mute:#9a93ad;--acc:#c9a54a;--bad:#d9534f;--good:#4caf7d;--mana:#4a8fd9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif}
main{max-width:760px;margin:auto;padding:16px}h1{color:var(--acc);margin:.2em 0}h2{margin:.3em 0}
.card{background:var(--panel);border-radius:10px;padding:14px;margin:10px 0}
button{background:#2d2840;color:var(--ink);border:1px solid #453d5e;border-radius:8px;padding:8px 12px;margin:4px;cursor:pointer;font:inherit}
button:hover:not(:disabled){border-color:var(--acc)}button:disabled{opacity:.4;cursor:default}
.bar{height:12px;background:#000;border-radius:6px;overflow:hidden;margin:3px 0}.bar>i{display:block;height:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>.card{flex:1;min-width:220px}
.mute{color:var(--mute);font-size:13px}#log{max-height:160px;overflow:auto;font-size:13px}
.r1{color:#bbb}.r2{color:#6fcf6f}.r3{color:#5aa9ff}.r4{color:#c77dff}.r5{color:#ffb020}
.card{position:relative}.foe{font-size:56px;text-align:center;line-height:1.1;transition:transform .2s}
.shake{animation:sh .35s}@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pop{position:absolute;right:16px;top:8px;font-weight:700;font-size:22px;animation:up 1s forwards;pointer-events:none}
@keyframes up{to{transform:translateY(-40px);opacity:0}}.glow{animation:gl 1.2s infinite alternate}@keyframes gl{to{text-shadow:0 0 14px currentColor}}
.tag{display:inline-block;background:#3a2f55;border-radius:5px;padding:1px 6px;font-size:12px;margin-left:4px}
#wrap{position:relative}#cv{cursor:crosshair;width:100%;image-rendering:pixelated;border-radius:10px;background:#000;display:block;box-shadow:0 0 0 2px #2d2840,0 8px 30px rgba(120,80,220,.35)}
#ov{position:absolute;inset:0;overflow:auto;background:rgba(20,18,28,.95);border-radius:8px;padding:8px 12px;font-family:monospace;font-size:13px}#ov:empty{display:none}
#ov h1{font-size:18px}#ov .card{padding:8px;margin:6px 0}#touch{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}#touch button{min-width:60px;padding:12px 10px;font-size:15px;margin:0;touch-action:manipulation}
body.embed main>h1,body.embed #touch,body.embed #hud,body.embed #help,body.embed #cv{display:none!important}
body.embed{background:radial-gradient(ellipse at top,#2c2148,#0c0916 70%);min-height:100vh}body.embed main{max-width:1180px;padding-top:12px}.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px}.ptile{background:rgba(255,255,255,.04);border:1px solid #3a3352;border-radius:8px;padding:6px 9px;font-size:13px;line-height:1.35}body.embed #ov{min-height:0!important}body.embed #wrap{position:static}
body.embed #ov{position:static;display:block;min-height:70vh;background:linear-gradient(180deg,#1f1933,#141020);border:2px solid #c9a54a;border-radius:16px;padding:20px 24px;font:15px/1.5 system-ui,sans-serif;box-shadow:0 0 0 4px #1a1528,0 14px 50px rgba(0,0,0,.7)}
body.embed #ov h1{font:700 28px system-ui,sans-serif;color:#ffd27a;letter-spacing:1px;text-shadow:0 2px 0 #000;margin:0 0 10px;border-bottom:1px solid #3a3352;padding-bottom:8px}
body.embed #ov .card{background:rgba(255,255,255,.035);border:1px solid #3a3352;border-radius:12px;padding:12px 14px}
body.embed #ov button{background:linear-gradient(180deg,#40376a,#2a2444);border:1px solid #c9a54a;border-radius:9px;padding:9px 15px;font-weight:600;color:#f2ecff;box-shadow:0 2px 0 #0008}
body.embed #ov button:hover:not(:disabled){filter:brightness(1.3)}body.embed #ov .tag{background:#3a2f55;border:1px solid #5a4a80}
input,select{background:#0e0c14;color:var(--ink);border:1px solid #453d5e;border-radius:6px;padding:6px;font:inherit}
</style></head><body><main><h1 id="ttl">Grimoire Trials</h1>
<div id="wrap"><canvas id="cv" width="320" height="180"></canvas><div id="ov"></div></div>
<div id="touch"><button data-k="arrowleft">◀</button><button data-k="arrowright">▶</button><button data-k=" ">Jump</button><button onclick="interact()">Act (E)</button><button onclick="melee()">Melee</button><button onclick="dash()">Dash</button><button onclick="pactSuper()">Pact</button><button onclick="if(G&&G.mode==='fight')busy()?app.innerHTML='':screenPause()">Pause</button></div>
<div class="card" id="hud"></div><p class="mute" id="help"></p></main>
<script>
// ---------- DATA ----------
const ELEMENTS={Fire:'bold',Water:'calm',Wind:'free',Earth:'steady',Lightning:'bold',Ice:'calm',Light:'kind',Shadow:'sly',Plant:'kind',Metal:'steady',Sound:'free',Time:'wise',Space:'wise',Poison:'sly',Crystal:'steady',Sand:'free',Mist:'sly',Gravity:'wise',Spirit:'kind',Lava:'bold',Star:'wise',Bubble:'calm',Paper:'wise',Thread:'sly',Ash:'bold',Glass:'calm',Moon:'kind',Storm:'free',Bone:'steady',Ink:'sly'};
const MODS=[['',1,60],['Twin',1.1,14],['Ancient',1.2,9],['Hollow',1.15,8],['Radiant',1.25,5],['Abyssal',1.35,3],['Primordial',1.5,1]]; // name, power mult, weight
const RARITY=['','Common','Uncommon','Rare','Epic','Legendary'];
const ADJ=['Searing','Silent','Howling','Crushing','Piercing','Gleaming','Veiled','Shattering','Rising','Endless','Spiral','Wild'];
const NOUN={dmg:['Lance','Burst','Fang','Wave','Bolt','Storm'],heal:['Bloom','Mend','Grace'],shield:['Wall','Ward','Shell'],dot:['Curse','Mark','Haze']};
const QUIZ=[
 ['A rival insults you. You…',[['Strike first','bold'],['Stay composed','calm'],['Plot a clever comeback','sly'],['Shrug, walk away','free']]],
 ['Your ideal place:',[['A quiet library','wise'],['An open sky','free'],['A mountain fortress','steady'],['A sunny garden','kind']]],
 ['A friend is hurt. You…',[['Heal them','kind'],['Guard them','steady'],['Hunt the attacker','bold'],['Find the root cause','wise']]],
 ['Pick a word:',[['Shadow','sly'],['Tide','calm'],['Spark','bold'],['Root','steady']]],
 ['Your greatest strength:',[['Patience','calm'],['Curiosity','wise'],['Courage','bold'],['Loyalty','kind']]],
 ['When a plan fails you…',[['Improvise','free'],['Try again harder','steady'],['Find a trick','sly'],['Stay calm & rethink','calm']]]];
const BANNED=/(damn|hell|shit|fuck|bitch|ass|kill|blood|sex|nazi|crap|dick|piss)/i;

// ---------- RNG ----------
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const pick=(r,a)=>a[Math.floor(r()*a.length)];
function wpick(r,list){let t=list.reduce((a,x)=>a+x[2],0),v=r()*t;for(const x of list){if((v-=x[2])<0)return x}return list[0]}

// ---------- STATE ----------
let S=load()||null, quizAns=[], E=null;
function save(){try{localStorage.setItem('grimoire',JSON.stringify(S))}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem('grimoire'))}catch(e){return null}}
const $=id=>document.getElementById(id), app=$('ov');

// ---------- GRIMOIRE GENERATION ----------
function makeGrimoire(answers){
  const seed=Date.now()^Math.floor(Math.random()*1e9), r=rng(seed);
  const traits={};answers.forEach(t=>traits[t]=(traits[t]||0)+1);
  // weight each element by matching personality trait — rare-ish combos possible
  const pool=Object.entries(ELEMENTS).map(([el,t])=>[el,0,1+(traits[t]||0)*4]);
  const el=wpick(r,pool)[0], mod=wpick(r,MODS);
  const rar=mod[2]>=60?1:mod[2]>=14?2:mod[2]>=8?3:mod[2]>=3?4:5;
  const name=(mod[0]?mod[0]+' ':'')+el+' Magic';
  const spells=['dmg','dmg','shield','heal'].map((k,i)=>genSpell(r,el,k,mod[1],i));
  return upgradeGrimoire({name,el,rarity:rar,mult:mod[1],seed,spells},r);
}
function genSpell(r,el,kind,mult,i){
  const base={dmg:[14,8],heal:[16,10],shield:[14,9],dot:[6,8],summon:[7,12],seal:[6,10],copy:[14,10]}[kind];
  const p=Math.round(base[0]*(0.85+r()*0.4)*mult);
  return {name:`${el} ${pick(r,ADJ)} ${pick(r,NOUN[kind])}`,kind,power:p,cost:Math.round(base[1]*(0.8+r()*0.5)),cd:i===1?2:0,recoil:0,cur:0};
}

// ---------- SCREENS ----------
function screenStart(){
  app.innerHTML=`<h1>Grimoire Trials</h1><div class="card"><p>Every mage receives a grimoire matched to their soul. Answer honestly — the magic chooses you.</p>
  <p class="mute">30 elements × 7 variants × randomized spells = thousands of combinations. Rarer variants drop less often.</p>
  <button onclick="if(!S||confirm('Replace your current grimoire?')){quizAns=[];screenQuiz()}">${S?'Retake the Trial':'Begin the Trial'}</button><button onclick="app.innerHTML=''">Close</button>${pactHtml()}${S&&S.lv>=20&&!S.awake?'<button onclick="startAwaken()">⚡ Awakening Trial</button><p class="mute">Face your own shadow. Win to awaken your magic: +25% power to every spell.</p>':S&&!S.awake?'<p class="mute">At level 20 the shrine can awaken your magic.</p>':''}${S?'<button onclick="screenHub()">Continue ('+S.g.name+', Lv '+S.lv+')</button>':''}</div>`;
}
function screenQuiz(){
  const q=QUIZ[quizAns.length];
  if(!q){const g=makeGrimoire(quizAns);S={g,lv:1,xp:0,hpMax:100,mpMax:60,wave:1,best:1,forgePts:0,inv:{}};save();return screenReveal()}
  app.innerHTML=`<h1>The Trial</h1><div class="card"><p class="mute">Question ${quizAns.length+1}/${QUIZ.length}</p><h2>${q[0]}</h2>
  ${q[1].map(a=>`<button onclick="quizAns.push('${a[1]}');screenQuiz()">${a[0]}</button>`).join('')}</div>`;
}
function screenReveal(){
  const g=S.g;app.innerHTML=`<h1>Your grimoire opens…</h1><div class="card"><h2 class="r${g.rarity}">${g.name}</h2>
  <p class="r${g.rarity}">${RARITY[g.rarity]} · ${'✦'.repeat(g.marks||3)} ${g.marks||3}-mark grimoire${g.el2?' · DUAL ELEMENT: '+g.el+' + '+g.el2:''}${g.el==='Null'?' · NULL: no spells, but your strikes erase magic and break wards':''}</p>${spellList(g.spells)}<button onclick="screenHub()">Continue</button></div>`;
}
function spellList(sp){return sp.map(s=>`<div>• <b>${s.name}</b> <span class="mute">${desc(s)}</span></div>`).join('')}
function desc(s){let t={dmg:`deals ${s.power}`,heal:`heals ${s.power}`,shield:`blocks ${s.power}`,dot:`${s.power}/sec for 3s`,summon:`summons a familiar (${s.power}/shot, 12s)`,seal:'seals an enemy for 3s (+25% damage taken)',copy:`copies the last enemy you hit (${s.power} power)`}[s.kind];
  t+=` · ${s.cost} MP`;if(s.cd)t+=` · ${s.cd}s cooldown`;if(s.recoil)t+=` · ${s.recoil} self-damage`;if(s.exhaust)t+=' · no mana regen for 3s';if(s.shape)t+=' · '+s.shape+' shape';if(s.fx&&s.fx.length)t+=' · '+s.fx.join(', ');return t}
function screenHub(){
  const g=S.g,need=xpNeed();
  app.innerHTML=`<h1>Grimoire Trials</h1><div class="card"><h2 class="r${g.rarity}">${g.name} <span class="mute">(${RARITY[g.rarity]} · ${'✦'.repeat(g.marks||3)})</span></h2><p class="mute">Element family: ${[g.el,g.el2].filter(Boolean).map(x=>(FAMOF(x)||'none')).join(' + ')}</p>
  <p>Level ${S.lv} · XP ${S.xp}/${need} · HP ${S.hpMax} · Mana ${S.mpMax} · Best wave ${S.best}</p>${bar(S.xp,need,'var(--acc)')}
  ${spellList(g.spells)}<p><b>Rank:</b> ${RANKS[rankIdx()][0]} ★${S.stars||0}${S.squad?' · <b style="color:'+SQ[S.squad].col+'">'+SQ[S.squad].n+'</b>':''}</p><p><b>Story:</b> ${storyLine()}</p>${S.pact?'<p><b>Pact:</b> '+(S.pact==='spirit'?'Spirit':'Dark')+' (press T in battle)</p>':''}<p><b>Techniques</b> <span class="mute">(unlock by leveling)</span></p>${TECH.map(t=>`<div class="${S.lv>=t[1]?"":"mute"}">${S.lv>=t[1]?"✔":"🔒 Lv "+t[1]} <b>${t[0]}</b> — ${t[2]}</div>`).join("")}<p><b>Combos</b> <span class="mute">(cast two different spells within 1s)</span></p><div class="mute">${Object.entries(COMBOS).map(([k,v])=>`<b>${v}</b>: ${k.split('>').map(x=>KN[x]).join(' → ')} (${COMBO_INFO[v]})`).join('<br>')}</div><p class="mute">Materials: ${Object.entries(S.mats||{}).filter(x=>x[1]).map(([k,v])=>k+' ×'+v).join(', ')||'none yet (enemies drop them)'}</p><p class="mute">Items: ${Object.entries(S.inv).filter(x=>x[1]).map(([k,v])=>`<span class="tag" title="${ITEMS[k]}">${k} ×${v}</span>`).join('')||'none yet (enemies drop them; bosses drop Star Dust)'}</p><p>
  <button onclick="startFight()">Fight wave ${S.wave}</button>
  <button onclick="screenPages()">📜 Page Binding</button><button onclick="screenTree()">Skill Trees</button><button onclick="screenBackup()">Backup</button><button onclick="screenLoadout()">Builds (using ${(S.bi||0)+1})</button><button onclick="screenForge()">Spell Forge (${S.forgePts} pts)</button>
  <button onclick="if(confirm('Abandon this grimoire and retake the trial?')){localStorage.removeItem('grimoire');S=null;app.innerHTML=''}">New grimoire</button><button onclick="app.innerHTML=''">Close</button></p>
  <p class="mute">Walk to the Spell Forge or Wave Portal in town to use them. You earn 1 Forge point every 3 levels, and your grimoire grants a new spell every 2 levels. Visit the Spell Sage in town to design spells by describing them. Enemies grow ~18% stronger every wave. Every 5th wave has a boss.</p></div>`;
}
const xpNeed=()=>Math.round(40*Math.pow(1.35,S.lv-1));

// ---------- SPELL FORGE ----------
function screenForge(){
  const cap=4+Math.floor(S.lv/2);
  app.innerHTML=`<h1>Spell Forge</h1><div class="card">
  <p>Name (letters only, family-friendly): <input id="fn" maxlength="24" placeholder="e.g. Comet Ward"></p>
  <p>Effect: <select id="fk" onchange="prev()"><option value="dmg">Damage</option><option value="heal">Heal</option><option value="shield">Shield</option><option value="dot">Damage over time</option><option value="summon">Summon familiar (Lv 8)</option><option value="seal">Seal an enemy (Lv 6)</option><option value="copy">Copy enemy magic (Lv 10)</option></select></p>
  <p>Shape: <select id="fsh" onchange="prev()"><option value="">Bolt (default)</option><option value="beam">Beam: instant line, hits every enemy in it</option><option value="wave">Wave: short cone of 5 shots</option><option value="orb">Orb: circles you for 5s</option><option value="trap">Trap: explodes when an enemy steps on it</option><option value="wall">Wall: barrier that blocks shots (shields only)</option></select></p>
  <p>Power tier: <input id="fp" type="range" min="1" max="${cap}" value="3" oninput="prev()"> <span id="fpv"></span> <span class="mute">(max ${cap} at your level)</span></p>
  <p>Required drawback: <select id="fd" onchange="prev()"><option value="recoil">Recoil — hurts you</option><option value="cd">Long cooldown</option><option value="burn">Mana burn — costs much more</option><option value="exhaust">Exhaustion — no regen for 3s</option></select></p>
  <p>Reduce the drawback with materials: <select id="fr" onchange="prev()">${REDT.map((x,i)=>`<option value="${i}">${x.n}${x.m?' · '+x.m+' materials'+(x.s?' + '+x.s+' Seal Fragment':''):''}</option>`).join('')}</select> <span class="mute">(uses your biggest material stacks; you have ${matTotal()})</span></p>
  <p>Catalyst (optional, consumed): <select id="fc" onchange="prev()"><option value="">None</option>${Object.entries(S.inv).filter(x=>x[1]).map(([k,v])=>`<option value="${k}">${k} ×${v} — ${ITEMS[k]}</option>`).join('')}</select></p>
  <p id="fprev" class="card"></p><p id="ferr" style="color:var(--bad)"></p>
  <button onclick="forge()">Forge spell</button><button onclick="screenPages()">📜 Page Binding</button><button onclick="screenHub()">Back</button></div>
  <div class="card"><b>Restriction Pact</b> (${S.restr||0}/3)<p class="mute">Permanently give up 10% of your max HP for +8% power on every spell you own.</p><button ${(S.restr||0)>=3?'disabled':''} onclick="restrict()">Make the pact</button></div>`;prev();
}
function forgeSpell(){return shapeIt(buildSpell($('fk').value,+$('fp').value+($('fc').value==='Star Dust'?2:0),$('fd').value,$('fc').value,REDT[+(($('fr')||{}).value||0)].r),$('fsh').value)}
function buildSpell(k,t,d,c,red){const m=S.g.mult,h=(c==='Ancient Rune'?.5:1)*(1-(red||0));
  const s={name:'',kind:k,power:Math.round({dmg:12,heal:12,shield:12,dot:5,summon:6,seal:4,copy:11}[k]*t*0.75*m+8),cost:4+t*4,cd:1,recoil:0,cur:0};
  if(c==='Ember Core')s.power=Math.round(s.power*1.2);
  if(d==='recoil')s.recoil=Math.round(t*3.5*h);if(d==='cd')s.cd=1+Math.ceil((1+t/2)*h);
  if(d==='burn')s.cost=Math.round(s.cost*(1+.7*h));if(d==='exhaust'&&(red||0)<.5)s.exhaust=1;
  if(c==='Mana Shard')s.cost=Math.round(s.cost*.7);return s;
}
function prev(){$('fpv').textContent=$('fp').value;$('fprev').innerHTML='Preview: '+desc(forgeSpell())}
function forge(){
  const n=$('fn').value.trim().replace(/\s+/g,' ');
  if(!/^[A-Za-z ]{3,24}$/.test(n))return $('ferr').textContent='Name must be 3–24 letters.';
  if(BANNED.test(n))return $('ferr').textContent='Please choose a family-friendly name.';
  const kreq={summon:8,seal:6,copy:10}[$('fk').value];if(kreq&&S.lv<kreq)return $('ferr').textContent='That magic unlocks at level '+kreq+'.';if(!S.forgePts)return $('ferr').textContent='You need a Forge point (earned every 3 levels).';if(S.g.spells.length>=16)return $('ferr').textContent='Your grimoire is full (16 spells).';
  const rt=REDT[+$('fr').value||0];if(rt.m&&!payMats(rt.m,rt.s))return $('ferr').textContent='Not enough materials for that reduction.';
  const s=forgeSpell(),c=$('fc').value;s.name=n;if(c)S.inv[c]--;S.g.spells.push(s);S.forgePts--;fixLoad();autoEquip(S.g.spells.length-1);save();screenHub();
}

// ---------- COMBAT (2D pixel platformer) ----------
const FOES=['Goblin','Wraith','Golem','Harpy','Basilisk','Shade','Troll','Wyrm','Lich','Behemoth','Slime','Spider Queen','Mimic','Fire Imp','Frost Giant'];
const TRAITS={armored:'Armored: takes 30% less damage',regen:'Regenerates HP over time',drain:'Steals 6 mana per hit',swift:'Moves twice as fast',enrage:'Hits harder over time'};
const ITEMS={'Mana Shard':'Catalyst: spell costs 30% less mana','Ember Core':'Catalyst: +20% spell power','Ancient Rune':'Catalyst: drawback is halved','Star Dust':'Catalyst: +2 power tiers above your cap'};
const EL_COL={Fire:'#ff6a3d',Water:'#3da5ff',Ice:'#9ee7ff',Lightning:'#ffe14d',Plant:'#5fd068',Shadow:'#a070ff',Light:'#fff3b0',Poison:'#a6e22e',Lava:'#ff4500',Star:'#ffd700',Moon:'#d8d8ff',Spirit:'#e0b0ff',Wind:'#bdf5d0',Earth:'#b08850',Metal:'#c0c8d0',Sound:'#ff9ad5',Time:'#e8d38a',Space:'#7a6cff',Crystal:'#8ff0ff',Sand:'#e6c47a',Mist:'#cfd8e0',Gravity:'#9b59b6',Bubble:'#a8e0ff',Paper:'#f5f0e0',Thread:'#ff8080',Ash:'#9a9a9a',Glass:'#d0f0ff',Storm:'#6080ff',Bone:'#eee8d0',Ink:'#5050a0'};
const elc=()=>EL_COL[S.g.el]||'#c9a54a';
function bar(v,m,c){return`<div class="bar"><i style="width:${Math.max(0,Math.min(100,v/m*100))}%;background:${c}"></i></div>`}
const SPR={me:["hh......",".hhhh...","..hhhhh.","hhhhhhhh","..sssss.","..ssese.","..sssss.",".rrrrr..",".rrrrbbb",".rrrrbbb","..r..r..",".kk..kk."],
 blob:["..oooo..",".oooooo.","owwoowwo","obwoobwo","oooooooo","oooooooo",".o.oo.o.","o..oo..o"]};
function spr(c,a,x,y,map,col,s,flip){for(let r=0;r<a.length;r++)for(let q=0;q<8;q++){const ch=a[r][flip?7-q:q];if(ch!=='.'){c.fillStyle=map[ch]||col;c.fillRect(Math.round(x+q*s),Math.round(y+r*s),s,s)}}}
const T=16,W=320,H=180,keys={};let G=null;
addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;const k=e.key.toLowerCase();keys[k]=1;ac();if(k==='m'){muted=!muted;try{localStorage.setItem('mute',muted?'1':'0')}catch(x){}if(G)say('Sound '+(muted?'off':'on'))}if(!G)return;
  if([' ','arrowup','arrowdown'].includes(k))e.preventDefault();
  if(G.mode==='fight'){if(k==='tab'){e.preventDefault();swapBuild()}if(e.repeat)return;
    const n=e.code.startsWith('Digit')?+e.code.slice(5):0,sk={q:1,e:2}[k]||(n>=1&&n<=4?n:0);if(sk)cast(sk-1,has('Overcharge')&&!!(keys.r||keys.k));
    if(k==='escape'||k==='p'){busy()?app.innerHTML='':screenPause()}if(k==='j'||k==='f')melee();if(k==='z'&&has('Mana Armor')){G.armor=!G.armor;say('Mana Armor '+(G.armor?'ON':'off'))}
    if(k==='g')field();if(k==='t')pactSuper();if(k==='shift'||k==='x'||k==='l')dash();if(k==='v'&&has('Flight')){G.fly=!G.fly;say('Flight '+(G.fly?'ON':'off'))}}
  else{if(k==='e'||k==='arrowdown')interact();if(k==='escape')app.innerHTML=''}});

const busy=()=>app.childElementCount>0;

function pactHtml(){if(!S)return '';if(!(S.lv>=12||story().shards>=2))return '<p class="mute">At level 12 (or with 2 Seal Shards) the shrine offers a pact.</p>';const cur=S.pact;
  return `<div class="card"><b>Pacts</b>${cur?' · current: <b>'+(cur==='spirit'?'Spirit Pact':'Dark Pact')+'</b>':''}<p class="mute">Choose one.${cur?' Switching costs 3 Seal Fragments.':''}</p>
  <p><b>Spirit Pact</b>: a spirit of your element floats beside you and fires at enemies. +10% spell power. Its meter fills as you deal damage; at 100% press <b>T</b> for Spirit Burst, which hits every enemy on screen.</p>
  <p><b>Dark Pact</b>: +30% spell damage, but a dark meter fills as you fight. From 40% press <b>T</b> to unleash a dark explosion around you. If it reaches 100%, the darkness takes over for 3 seconds: you charge at enemies with double melee damage, but take 50% more damage.</p>
  <button ${cur==='spirit'?'disabled':''} onclick="takePact('spirit')">Spirit Pact</button><button ${cur==='dark'?'disabled':''} onclick="takePact('dark')">Dark Pact</button><p id="perr" style="color:var(--bad)"></p></div>`}
function takePact(k){if(S.pact){S.mats=S.mats||{};if((S.mats[SEAL]||0)<3){const e=$('perr');if(e)e.textContent='Switching pacts costs 3 Seal Fragments.';return}S.mats[SEAL]-=3}S.pact=k;sfx('boss');save();screenStart()}

// ---------- PHASE 5: SQUADS, RANKS, RIVAL, DUNGEON ----------
BIOMES.push({n:'Forgotten Crypt',sky:['#04060c','#0c1424','#1a2638','#2a3a50'],l:['#141c2c','#0e1420','#080c14'],k1:4,t:['#3a4250','#424a58','#2a303c','#58627a','#1a1e28','#3a4a4a','#4a5a5a','#7a8a8a'],brick:1,amb:'firefly',fc:'#a8d8ff',fog:'rgba(120,160,220,.06)',gap:.1,liq:'poison',moon:'#a8c8ff',roster:['ghost','knight','archer','mage','crawler','slime','bat','imp'],boss:0});
const SQ={lions:{n:'Crimson Lions',col:'#d94a3a',d:'+15% damage while above half HP'},wardens:{n:'Azure Wardens',col:'#3a7ad9',d:'shields +25%, and you start every battle shielded'},
  hearts:{n:'Verdant Hearts',col:'#3aa95a',d:'healing +30%, and you slowly regenerate HP'},gale:{n:'Gale Riders',col:'#e8d070',d:'+15% speed and one extra mid-air jump'}};
const RANKS=[['Recruit',0],['Knight',10],['Senior Knight',25],['Captain',50],['Vice-Commander',90],['Grand Mage',150]];
function rankIdx(){const s=(S&&S.stars)||0;let i=0;RANKS.forEach((r,j)=>{if(s>=r[1])i=j});return i}
function addStars(n,msgs){const b=rankIdx();S.stars=(S.stars||0)+n;if(msgs)msgs.push('+'+n+' merit star'+(n>1?'s':'')+' ★');const a=rankIdx();if(a>b&&msgs)msgs.push('<b style="color:#ffd700">PROMOTED to '+RANKS[a][0]+'!</b> (+3% spell power)')}
function screenHall(){const ri=rankIdx(),nx=RANKS[ri+1],st=S.stars||0;
  app.innerHTML=`<h1>Knight Hall</h1><div class="card"><p>Rank: <b>${RANKS[ri][0]}</b> · ★ ${st}${nx?' · next: '+nx[0]+' at ★'+nx[1]:' · highest rank!'}</p>${nx?bar(st-RANKS[ri][1],nx[1]-RANKS[ri][1],'#ffd700'):''}
  <p class="mute">Earn merit stars by clearing story stages (+3, guardians +5), endless waves (+1), dungeons (+4) and beating your rival (+5). Each rank adds +3% spell power.</p></div>
  <div class="card"><b>Squads</b>${S.squad?' · you serve the <b style="color:'+SQ[S.squad].col+'">'+SQ[S.squad].n+'</b>':''}${S.lv<5?'<p class="mute">Squads accept mages from level 5.</p>':Object.entries(SQ).map(([k,q])=>`<div style="margin:4px 0"><b style="color:${q.col}">${q.n}</b> <span class="mute">${q.d}</span> ${S.squad===k?'<span class="tag">your squad</span>':`<button onclick="joinSquad('${k}')">${S.squad?'Transfer (2 Seal Fragments)':'Join'}</button>`}</div>`).join('')}<p id="herr" style="color:var(--bad)"></p></div>
  <div class="card"><b>Rival</b><p class="mute">${rivalLine()}</p>${rivalReady()&&(S.rivalWins||0)<5?'<button onclick="startRival()">Duel '+RIVAL+'</button>':''}</div><button onclick="app.innerHTML=''">Close</button>`}
function joinSquad(k){if(S.lv<5)return;if(S.squad){S.mats=S.mats||{};if((S.mats[SEAL]||0)<2){$('herr').textContent='Transferring costs 2 Seal Fragments.';return}S.mats[SEAL]-=2}S.squad=k;sfx('level');save();screenHall()}
const RIVAL='Kael';
function rivalReady(){return S.lv>=6+4*(S.rivalWins||0)}
function rivalLine(){const w=S.rivalWins||0;return w>=5?RIVAL+' admits you are the stronger mage. (Rival beaten 5 times.)':rivalReady()?RIVAL+', a rival mage whose element counters yours, waits at the Portal. "Let\'s see if you\'ve grown."':RIVAL+' is training. They will challenge you again at level '+(6+4*w)+'.'}
function startRival(){if(!rivalReady())return;startFight({w:6+(S.rivalWins||0)*5,obj:'boss',rival:1})}
function startDungeon(){startFight({w:Math.max(3,Math.min(S.lv,30)),obj:'chests',dungeon:1})}
function chestLoot(q){S.mats=S.mats||{};for(let i=0;i<3;i++){const k=MATS[Math.floor(Math.random()*5)];S.mats[k]=(S.mats[k]||0)+1;pop({x:q.x,y:q.y-10*i},'+1 '+k,'#9ad7ff')}
  if(Math.random()<.3){S.mats[SEAL]=(S.mats[SEAL]||0)+1;pop({x:q.x,y:q.y-30},'+1 Seal Fragment','#ffd700')}
  if(Math.random()<.4){const ik=Object.keys(ITEMS),it=ik[Math.floor(Math.random()*4)];S.inv[it]=(S.inv[it]||0)+1;G.msgs.push('Found: '+it)}}
function finishSpecial(won,kind){const g=G,m=g.msgs;
  if(won){sfx('win');if(kind==='rival'){S.rivalWins=(S.rivalWins||0)+1;gainXP(Math.round(40*Math.pow(1.15,S.lv)));
      m.unshift('<b>'+RIVAL+' is defeated!</b> "'+['Not bad... I will be back.','You got lucky. Next time!','How are you this strong?','I... need to train harder.','You are the better mage. For now.'][Math.min(4,S.rivalWins-1)]+'"');
      addStars(5,m);S.mats=S.mats||{};S.mats[SEAL]=(S.mats[SEAL]||0)+1;m.push('+1 Seal Fragment')}
    else{m.unshift('<b>Dungeon cleared!</b>');addStars(4,m);gainXP(Math.round(30*Math.pow(1.12,S.lv)))}}
  else m.unshift(kind==='rival'?RIVAL+': "Ha! Come back when you are stronger."':'You flee the crypt. Its treasure remains.');
  save();startTown();G.p.x=24*T;app.innerHTML=`<h1>${won?'Victory!':'Defeated'}</h1><div class="card">${tidy(m).map(x=>`<div>${x}</div>`).join('')}<p>Lv ${S.lv} · ★ ${S.stars||0} (${RANKS[rankIdx()][0]})</p><button onclick="app.innerHTML=''">Back to town</button></div>`}

// ---------- AIMING ----------
const MOUSE={x:0,y:0,on:false};
{const cv=$('cv');cv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect();MOUSE.x=(e.clientX-r.left)/r.width*W;MOUSE.y=(e.clientY-r.top)/r.height*H;MOUSE.on=true});cv.addEventListener('mouseleave',()=>MOUSE.on=false)}
function softTarget(all){const p=G.p,x0=p.x+4,y0=p.y+6;let best=null,bd=1e9;
  for(const e of G.en){if(e.dead||(e.type==='ghost'&&!e.vis))continue;const dx=e.x+e.w/2-x0,dy=e.y+e.h/2-y0;if(!all&&dx*p.dir<-4)continue;const d=Math.hypot(dx,dy);
    if(d>(all?230:200)||(!all&&Math.abs(Math.atan2(dy,Math.abs(dx)))>.61))continue;if(d<bd){bd=d;best=e}}return best}
function aimVec(){const p=G.p,x0=p.x+4,y0=p.y+6;
  if(S.aim==='mouse'&&MOUSE.on){const dx=MOUSE.x+(G.cam||0)-x0,dy=MOUSE.y-y0,d=Math.hypot(dx,dy)||1;if(Math.abs(dx)>2)p.dir=Math.sign(dx);return{x:dx/d,y:dy/d}}
  const t=softTarget(S.aim!=='soft');if(t){const dx=t.x+t.w/2-x0,dy=t.y+t.h/2-y0,d=Math.hypot(dx,dy)||1;if(S.aim!=='soft'&&Math.abs(dx)>2)p.dir=Math.sign(dx);return{x:dx/d,y:dy/d}}return{x:p.dir,y:0}}

// ---------- RESULTS SUMMARY ----------
function fightStats(){const k=G.kills||0,cb=G.combos||0;G.msgs.push('Enemies defeated: '+k+(cb?' · Combos: '+cb:''))}
function tidy(m){const out=[],cnt={};for(const x of m){if(cnt[x])cnt[x]++;else{cnt[x]=1;out.push(x)}}return out.map(x=>cnt[x]>1?x+' ×'+cnt[x]:x)}

function autoMelee(){if(!has('Weapon Infusion')||G.mel>0||busy()||G.frenzy>0)return;const p=G.p,cx=p.x+4;
  const e=G.en.find(e=>!e.dead&&!(e.type==='ghost'&&!e.vis)&&Math.abs(e.x+e.w/2-cx)<20&&e.y<p.y+p.h+4&&e.y+e.h>p.y-6);if(!e)return;
  p.dir=Math.sign(e.x+e.w/2-cx)||p.dir;melee(true)}

// ---------- EMBEDDED MENUS (opened from the 3D world) ----------
function embedMenu(){const q=new URLSearchParams(location.search),m=q.get('menu');if(!m){if(location.replace)location.replace('./');return}
  const b=document.createElement('button');b.textContent='⟵ Back to the world (Esc)';b.style.cssText='position:fixed;right:16px;top:14px;z-index:9;padding:12px 16px;border:1px solid #c9a54a;font-weight:700';

  new MutationObserver(()=>{if(!app.childElementCount)back()}).observe(app,{childList:true});addEventListener('keydown',e=>{if(e.key==='Escape')back()});
  startFight=startStory=startDungeon=worldOnly;startAwaken=()=>{save();parent.postMessage('g3d-awaken','*')};startRival=()=>{if(rivalReady()){save();parent.postMessage('g3d-rival','*')}};
  if(!S){screenStart();return}const map={pages:screenPages,hub:screenHub,forge:screenForge,sage:screenSage,tree:screenTree,builds:screenLoadout,hall:screenHall,shrine:screenStart};(map[m]||screenHub)()}

// ---------- GRIMOIRE PAGE FRAGMENTS & PAGE BINDING ----------
const PTRAITS=[
 {id:'bolt',n:'Bolt',type:'Form',d:'a single fast shot'},{id:'area',n:'Area',type:'Form',d:'explodes and hits everything around the target'},{id:'beam',n:'Beam',type:'Form',d:'an instant line through enemies'},
 {id:'wave',n:'Wave',type:'Form',d:'a cone of 5 short shots'},{id:'orb',n:'Orb',type:'Form',d:'circles around you'},{id:'trap',n:'Trap',type:'Form',d:'explodes when stepped on'},{id:'summon',n:'Summon',type:'Form',d:'a familiar that fights for you'},
 {id:'poison',n:'Poison',type:'Effect',d:'damage over time'},{id:'burn',n:'Burn',type:'Effect',d:'damage over time'},{id:'freeze',n:'Freeze',type:'Effect',d:'stops enemies'},{id:'slow',n:'Slow',type:'Effect',d:'slows enemies'},
 {id:'drain',n:'Life Steal',type:'Effect',d:'heals you for part of the damage'},{id:'pierce',n:'Pierce',type:'Effect',d:'passes through enemies'},{id:'pull',n:'Pull',type:'Effect',d:'drags enemies toward you'},{id:'push',n:'Push',type:'Effect',d:'knocks enemies away'},
 {id:'chain',n:'Chain',type:'Effect',d:'jumps to 2 more enemies'},{id:'multi',n:'Multi-shot',type:'Effect',d:'3 shots instead of 1'},
 {id:'big',n:'Big',type:'Modifier',d:'larger and 15% stronger'},{id:'fast',n:'Fast',type:'Modifier',d:'much faster shots'},{id:'linger',n:'Lingering',type:'Modifier',d:'effects last twice as long'},{id:'echo',n:'Echo',type:'Modifier',d:'casts again a moment later'}];
const RAR=['Common','Uncommon','Rare','Epic','Legendary'],RAR_COL=['#e8e8e8','#5fd068','#3da5ff','#c070ff','#ffd700'],RANK_PTS=[3,8,15,25,40];
const PB={sel:{form:'bolt',mods:[]}};
function pageRank(id){const p=(S.pageP&&S.pageP[id])||0;let r=0;RANK_PTS.forEach((v,i)=>{if(p>=v)r=i+1});return id==='bolt'?Math.max(1,r):r}
function rollFrag(b){const w=[50,28,14,6,2].map((v,k)=>v*(1+b*k*1.5)),tot=w.reduce((a,x)=>a+x,0);let v=Math.random()*tot,rar=0;for(;rar<4;rar++){if((v-=w[rar])<0)break}
  return{trait:PTRAITS[Math.floor(Math.random()*PTRAITS.length)].id,rar}}
function gainFrag(q){S.pageP=S.pageP||{};const t=PTRAITS.find(x=>x.id===q.trait),b=pageRank(q.trait);S.pageP[q.trait]=(S.pageP[q.trait]||0)+q.rar+1;const a=pageRank(q.trait);
  pop(G.p,RAR[q.rar]+' '+t.n+' fragment',RAR_COL[q.rar]);sfx('pick');if(a>b)say((b?t.n+' page ranked up to '+RAR[a-1]:'New page bound: '+t.n+' ('+RAR[a-1]+')')+'!',1);save()}
function craftPreview(sel){const ids=[sel.form,...sel.mods],sum=ids.reduce((a,id)=>a+pageRank(id),0),lvl=1+S.lv*.06,f=sel.form;
  const s={name:'',kind:f==='summon'?'summon':'dmg',power:Math.round(12*(S.g.mult||1)*lvl*(1+.1*sum)),cost:6+4*sel.mods.length+2*sum+({area:4,beam:3,orb:5,trap:2,summon:6,wave:3}[f]||0),
    cd:+(.4*sel.mods.length+({area:1,beam:1,orb:2,trap:2,summon:3,wave:.5}[f]||0)).toFixed(1),recoil:0,cur:0,src:'forge',fx:[]};
  if(['beam','wave','orb','trap'].includes(f))s.shape=f;if(f==='area')s.fx.push('area');for(const m of sel.mods)s.fx.push(m);
  s.dotMul=+(.2+.05*Math.max(pageRank('poison'),pageRank('burn'))).toFixed(2);if(sel.mods.includes('big'))s.power=Math.round(s.power*1.15);if(sel.mods.includes('echo'))s.cost=Math.round(s.cost*1.6);return s}
function pbToggle(id){const m=PB.sel.mods,k=m.indexOf(id);if(k>=0)m.splice(k,1);else if(m.length<pbMax())m.push(id);screenPages()}
function pbMax(){return 2+Math.floor(S.lv/5)}
function pbCraft(){const n=$('pbn').value.trim().replace(/\s+/g,' '),er=m=>$('pberr').textContent=m;if(!/^[A-Za-z ]{3,24}$/.test(n))return er('Name must be 3–24 letters.');if(BANNED.test(n))return er('Please choose a family-friendly name.');
  if(S.g.spells.length>=16)return er('Your grimoire is full (16 spells).');const s=craftPreview(PB.sel);s.name=n;s.el=S.g.el;S.g.spells.push(s);fixLoad();autoEquip(S.g.spells.length-1);save();sfx('level');
  PB.sel={form:'bolt',mods:[]};screenPages();$('pberr').style.color='var(--good)';$('pberr').textContent='"'+n+'" is bound into your grimoire! Equip it in Builds.'}
function screenPages(){S.pageP=S.pageP||{};const sel=PB.sel;if(!pageRank(sel.form))sel.form='bolt';sel.mods=sel.mods.filter(m=>pageRank(m));
  const rows=['Form','Effect','Modifier'].map(ty=>'<p style="margin:10px 0 4px"><b>'+ty+'s</b></p><div class="pgrid">'+PTRAITS.filter(t=>t.type===ty).map(t=>{const pts=S.pageP[t.id]||0,rk=pageRank(t.id),nx=RANK_PTS[rk];
    return '<div class="ptile"><b style="color:'+(rk?RAR_COL[rk-1]:'#6a6480')+'">'+t.n+'</b> '+(rk?'<span class="tag">'+RAR[rk-1]+'</span>':'<span class="mute">not bound</span>')+' <span class="mute">'+t.d+(t.id==='bolt'&&!pts?'':' · '+pts+(nx?'/'+nx:'')+' pts')+'</span></div>'}).join('')+'</div>').join('');
  const forms=PTRAITS.filter(t=>t.type==='Form'&&pageRank(t.id)),mods=PTRAITS.filter(t=>t.type!=='Form'&&pageRank(t.id)),pv=craftPreview(sel),hl='style="border-color:#ffd27a;color:#ffd27a"';
  app.innerHTML='<h1>Page Binding</h1><div class="card"><p class="mute">Glowing page fragments appear in levels and around the 3D world. Each fragment gives points to its trait (Common 1 · Uncommon 2 · Rare 3 · Epic 4 · Legendary 5). Enough points bind a page, and more points rank it up from Common to Legendary.</p>'+rows+'</div>'+
   '<div class="card"><b>Craft a spell</b><p>Form: '+forms.map(t=>'<button onclick="PB.sel.form=\''+t.id+'\';screenPages()" '+(sel.form===t.id?hl:'')+'>'+t.n+'</button>').join(' ')+'</p>'+
   '<p>Traits (up to '+pbMax()+' at level '+S.lv+', +1 every 5 levels; each one adds mana cost): '+(mods.map(t=>'<button onclick="pbToggle(\''+t.id+'\')" '+(sel.mods.includes(t.id)?hl:'')+'>'+(sel.mods.includes(t.id)?'✔ ':'')+t.n+'</button>').join(' ')||'<span class="mute">none yet. Collect fragments!</span>')+'</p>'+
   '<p>Result: <b>'+desc(pv)+'</b></p><p>Name: <input id="pbn" maxlength="24"> <button onclick="pbCraft()">Bind spell</button></p><p id="pberr" style="color:var(--bad)"></p></div><button onclick="screenHub()">Back</button>'}

// ---------- KEY ASSIGNMENT ----------
const LD={pick:null};
const EMPTY=()=>({name:'empty',kind:'none',power:0,cost:0,cd:0,cur:0,empty:true,fx:[]});
function spOf(){return S.load.map(i=>i==null||!S.g.spells[i]?EMPTY():S.g.spells[i])}
function autoEquip(x){const k=S.load.indexOf(null);if(k>=0)S.load[k]=x;else if(S.load.length<4)S.load.push(x)}
function loadPicker(){if(LD.pick==null||!S.g.spells[LD.pick])return '';const l=S.builds[S.bi].load,K=['Q','E','Left click','Right click'];
  return '<div class="card" style="border-color:#ffd27a"><b>Assign "'+esc(S.g.spells[LD.pick].name)+'" to which key?</b><p>'+K.map((k,s)=>{const cur=l[s]!=null&&S.g.spells[l[s]]?S.g.spells[l[s]].name:'empty';
    return '<button onclick="assignSlot('+s+')">['+k+'] '+esc(cur)+'</button>'}).join(' ')+' <button onclick="LD.pick=null;screenLoadout()">Cancel</button></p><p class="mute">The spell already on that key is unequipped.</p></div>'}
function assignSlot(s){const l=S.builds[S.bi].load;while(l.length<=s)l.push(null);const ex=l.indexOf(LD.pick);if(ex>=0)l[ex]=null;l[s]=LD.pick;LD.pick=null;fixLoad();save();sfx('pick');screenLoadout()}

// ---------- FORGE: DRAWBACK REDUCTION WITH MATERIALS ----------
const REDT=[{n:'None',r:0,m:0},{n:'Minor (−25%)',r:.25,m:3},{n:'Major (−50%, also removes Exhaustion)',r:.5,m:8},{n:'Masterwork (−75%)',r:.75,m:15,s:1}];
function matTotal(){S.mats=S.mats||{};return MATS.reduce((a,k)=>a+(S.mats[k]||0),0)}
function payMats(n,seal){S.mats=S.mats||{};if(matTotal()<n||(S.mats[SEAL]||0)<(seal||0))return false;for(let i=0;i<n;i++){const k=MATS.slice().sort((a,b)=>(S.mats[b]||0)-(S.mats[a]||0))[0];S.mats[k]--}if(seal)S.mats[SEAL]-=seal;return true}

function worldOnly(){app.innerHTML='<h1>To the world!</h1><div class="card"><p>Battles, crypts, quests and waves happen in the open world now. Close this menu and head out.</p><button onclick="app.innerHTML=\'\'">Back to the world</button></div>'}
if(S)S.inv=S.inv||{};
startTown();embedMenu();
