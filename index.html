<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grimoire Trials</title>
<style>
:root{--bg:#14121c;--panel:#1f1c2b;--ink:#ece8f5;--mute:#9a93ad;--acc:#c9a54a;--bad:#d9534f;--good:#4caf7d;--mana:#4a8fd9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif}
main{max-width:760px;margin:auto;padding:16px}h1{color:var(--acc);margin:.2em 0}h2{margin:.3em 0}
.card{background:var(--panel);border-radius:10px;padding:14px;margin:10px 0}
button{background:#2d2840;color:var(--ink);border:1px solid #453d5e;border-radius:8px;padding:8px 12px;margin:4px;cursor:pointer;font:inherit}
button:hover:not(:disabled){border-color:var(--acc)}button:disabled{opacity:.4;cursor:default}
.bar{height:12px;background:#000;border-radius:6px;overflow:hidden;margin:3px 0}.bar>i{display:block;height:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>.card{flex:1;min-width:220px}
.mute{color:var(--mute);font-size:13px}#log{max-height:160px;overflow:auto;font-size:13px}
.r1{color:#bbb}.r2{color:#6fcf6f}.r3{color:#5aa9ff}.r4{color:#c77dff}.r5{color:#ffb020}
.card{position:relative}.foe{font-size:56px;text-align:center;line-height:1.1;transition:transform .2s}
.shake{animation:sh .35s}@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pop{position:absolute;right:16px;top:8px;font-weight:700;font-size:22px;animation:up 1s forwards;pointer-events:none}
@keyframes up{to{transform:translateY(-40px);opacity:0}}.glow{animation:gl 1.2s infinite alternate}@keyframes gl{to{text-shadow:0 0 14px currentColor}}
.tag{display:inline-block;background:#3a2f55;border-radius:5px;padding:1px 6px;font-size:12px;margin-left:4px}
#wrap{position:relative}#cv{width:100%;image-rendering:pixelated;border-radius:8px;background:#000;display:block}
#ov{position:absolute;inset:0;overflow:auto;background:rgba(20,18,28,.95);border-radius:8px;padding:8px 12px;font-family:monospace;font-size:13px}#ov:empty{display:none}
#ov h1{font-size:18px}#ov .card{padding:8px;margin:6px 0}#touch button{min-width:56px}
input,select{background:#0e0c14;color:var(--ink);border:1px solid #453d5e;border-radius:6px;padding:6px;font:inherit}
</style></head><body><main><h1 id="ttl">Grimoire Trials</h1>
<div id="wrap"><canvas id="cv" width="320" height="180"></canvas><div id="ov"></div></div>
<div id="touch"><button data-k="arrowleft">◀</button><button data-k="arrowright">▶</button><button data-k=" ">Jump</button><button onclick="interact()">Act (E)</button></div>
<div class="card" id="hud"></div><p class="mute" id="help"></p></main>
<script>
// ---------- DATA ----------
const ELEMENTS={Fire:'bold',Water:'calm',Wind:'free',Earth:'steady',Lightning:'bold',Ice:'calm',Light:'kind',Shadow:'sly',Plant:'kind',Metal:'steady',Sound:'free',Time:'wise',Space:'wise',Poison:'sly',Crystal:'steady',Sand:'free',Mist:'sly',Gravity:'wise',Spirit:'kind',Lava:'bold',Star:'wise',Bubble:'calm',Paper:'wise',Thread:'sly',Ash:'bold',Glass:'calm',Moon:'kind',Storm:'free',Bone:'steady',Ink:'sly'};
const MODS=[['',1,60],['Twin',1.1,14],['Ancient',1.2,9],['Hollow',1.15,8],['Radiant',1.25,5],['Abyssal',1.35,3],['Primordial',1.5,1]]; // name, power mult, weight
const RARITY=['','Common','Uncommon','Rare','Epic','Legendary'];
const ADJ=['Searing','Silent','Howling','Crushing','Piercing','Gleaming','Veiled','Shattering','Rising','Endless','Spiral','Wild'];
const NOUN={dmg:['Lance','Burst','Fang','Wave','Bolt','Storm'],heal:['Bloom','Mend','Grace'],shield:['Wall','Ward','Shell'],dot:['Curse','Mark','Haze']};
const QUIZ=[
 ['A rival insults you. You…',[['Strike first','bold'],['Stay composed','calm'],['Plot a clever comeback','sly'],['Shrug, walk away','free']]],
 ['Your ideal place:',[['A quiet library','wise'],['An open sky','free'],['A mountain fortress','steady'],['A sunny garden','kind']]],
 ['A friend is hurt. You…',[['Heal them','kind'],['Guard them','steady'],['Hunt the attacker','bold'],['Find the root cause','wise']]],
 ['Pick a word:',[['Shadow','sly'],['Tide','calm'],['Spark','bold'],['Root','steady']]],
 ['Your greatest strength:',[['Patience','calm'],['Curiosity','wise'],['Courage','bold'],['Loyalty','kind']]],
 ['When a plan fails you…',[['Improvise','free'],['Try again harder','steady'],['Find a trick','sly'],['Stay calm & rethink','calm']]]];
const BANNED=/(damn|hell|shit|fuck|bitch|ass|kill|blood|sex|nazi|crap|dick|piss)/i;

// ---------- RNG ----------
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const pick=(r,a)=>a[Math.floor(r()*a.length)];
function wpick(r,list){let t=list.reduce((a,x)=>a+x[2],0),v=r()*t;for(const x of list){if((v-=x[2])<0)return x}return list[0]}

// ---------- STATE ----------
let S=load()||null, quizAns=[], E=null;
function save(){try{localStorage.setItem('grimoire',JSON.stringify(S))}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem('grimoire'))}catch(e){return null}}
const $=id=>document.getElementById(id), app=$('ov');

// ---------- GRIMOIRE GENERATION ----------
function makeGrimoire(answers){
  const seed=Date.now()^Math.floor(Math.random()*1e9), r=rng(seed);
  const traits={};answers.forEach(t=>traits[t]=(traits[t]||0)+1);
  // weight each element by matching personality trait — rare-ish combos possible
  const pool=Object.entries(ELEMENTS).map(([el,t])=>[el,0,1+(traits[t]||0)*4]);
  const el=wpick(r,pool)[0], mod=wpick(r,MODS);
  const rar=mod[2]>=60?1:mod[2]>=14?2:mod[2]>=8?3:mod[2]>=3?4:5;
  const name=(mod[0]?mod[0]+' ':'')+el+' Magic';
  const spells=['dmg','dmg','shield','heal'].map((k,i)=>genSpell(r,el,k,mod[1],i));
  return {name,el,rarity:rar,mult:mod[1],seed,spells};
}
function genSpell(r,el,kind,mult,i){
  const base={dmg:[14,8],heal:[16,10],shield:[14,9],dot:[6,8]}[kind];
  const p=Math.round(base[0]*(0.85+r()*0.4)*mult);
  return {name:`${el} ${pick(r,ADJ)} ${pick(r,NOUN[kind])}`,kind,power:p,cost:Math.round(base[1]*(0.8+r()*0.5)),cd:i===1?2:0,recoil:0,cur:0};
}

// ---------- SCREENS ----------
function screenStart(){
  app.innerHTML=`<h1>Grimoire Trials</h1><div class="card"><p>Every mage receives a grimoire matched to their soul. Answer honestly — the magic chooses you.</p>
  <p class="mute">30 elements × 7 variants × randomized spells = thousands of combinations. Rarer variants drop less often.</p>
  <button onclick="if(!S||confirm('Replace your current grimoire?')){quizAns=[];screenQuiz()}">${S?'Retake the Trial':'Begin the Trial'}</button><button onclick="app.innerHTML=''">Close</button>${S?'<button onclick="screenHub()">Continue ('+S.g.name+', Lv '+S.lv+')</button>':''}</div>`;
}
function screenQuiz(){
  const q=QUIZ[quizAns.length];
  if(!q){const g=makeGrimoire(quizAns);S={g,lv:1,xp:0,hpMax:100,mpMax:60,wave:1,best:1,forgePts:0,inv:{}};save();return screenReveal()}
  app.innerHTML=`<h1>The Trial</h1><div class="card"><p class="mute">Question ${quizAns.length+1}/${QUIZ.length}</p><h2>${q[0]}</h2>
  ${q[1].map(a=>`<button onclick="quizAns.push('${a[1]}');screenQuiz()">${a[0]}</button>`).join('')}</div>`;
}
function screenReveal(){
  const g=S.g;app.innerHTML=`<h1>Your grimoire opens…</h1><div class="card"><h2 class="r${g.rarity}">${g.name}</h2>
  <p class="r${g.rarity}">${RARITY[g.rarity]}</p>${spellList(g.spells)}<button onclick="screenHub()">Continue</button></div>`;
}
function spellList(sp){return sp.map(s=>`<div>• <b>${s.name}</b> <span class="mute">${desc(s)}</span></div>`).join('')}
function desc(s){let t={dmg:`deals ${s.power}`,heal:`heals ${s.power}`,shield:`blocks ${s.power}`,dot:`${s.power}/sec for 3s`}[s.kind];
  t+=` · ${s.cost} MP`;if(s.cd)t+=` · ${s.cd}s cooldown`;if(s.recoil)t+=` · ${s.recoil} self-damage`;if(s.exhaust)t+=' · no mana regen for 3s';if(s.fx&&s.fx.length)t+=' · '+s.fx.join(', ');return t}
function screenHub(){
  const g=S.g,need=xpNeed();
  app.innerHTML=`<h1>Grimoire Trials</h1><div class="card"><h2 class="r${g.rarity}">${g.name} <span class="mute">(${RARITY[g.rarity]})</span></h2>
  <p>Level ${S.lv} · XP ${S.xp}/${need} · HP ${S.hpMax} · Mana ${S.mpMax} · Best wave ${S.best}</p>${bar(S.xp,need,'var(--acc)')}
  ${spellList(g.spells)}<p><b>Techniques</b> <span class="mute">(unlock by leveling)</span></p>${TECH.map(t=>`<div class="${S.lv>=t[1]?"":"mute"}">${S.lv>=t[1]?"✔":"🔒 Lv "+t[1]} <b>${t[0]}</b> — ${t[2]}</div>`).join("")}<p class="mute">Items: ${Object.entries(S.inv).filter(x=>x[1]).map(([k,v])=>`<span class="tag" title="${ITEMS[k]}">${k} ×${v}</span>`).join('')||'none yet (enemies drop them; bosses drop Star Dust)'}</p><p>
  <button onclick="startFight()">Fight wave ${S.wave}</button>
  <button onclick="screenLoadout()">Loadout (${(S.load||[]).length||Math.min(5,g.spells.length)}/5)</button><button onclick="screenForge()">Spell Forge (${S.forgePts} pts)</button>
  <button onclick="if(confirm('Abandon this grimoire and retake the trial?')){localStorage.removeItem('grimoire');S=null;app.innerHTML=''}">New grimoire</button><button onclick="app.innerHTML=''">Close</button></p>
  <p class="mute">Walk to the Spell Forge or Wave Portal in town to use them. You earn 1 Forge point every 3 levels, and your grimoire grants a new spell every 2 levels. Visit the Spell Sage in town to design spells by describing them. Enemies grow ~18% stronger every wave. Every 5th wave has a boss.</p></div>`;
}
const xpNeed=()=>Math.round(40*Math.pow(1.35,S.lv-1));

// ---------- SPELL FORGE ----------
function screenForge(){
  const cap=4+Math.floor(S.lv/2);
  app.innerHTML=`<h1>Spell Forge</h1><div class="card">
  <p>Name (letters only, family-friendly): <input id="fn" maxlength="24" placeholder="e.g. Comet Ward"></p>
  <p>Effect: <select id="fk" onchange="prev()"><option value="dmg">Damage</option><option value="heal">Heal</option><option value="shield">Shield</option><option value="dot">Damage over time</option></select></p>
  <p>Power tier: <input id="fp" type="range" min="1" max="${cap}" value="3" oninput="prev()"> <span id="fpv"></span> <span class="mute">(max ${cap} at your level)</span></p>
  <p>Required drawback: <select id="fd" onchange="prev()"><option value="recoil">Recoil — hurts you</option><option value="cd">Long cooldown</option><option value="burn">Mana burn — costs much more</option><option value="exhaust">Exhaustion — no regen for 3s</option></select></p>
  <p>Catalyst (optional, consumed): <select id="fc" onchange="prev()"><option value="">None</option>${Object.entries(S.inv).filter(x=>x[1]).map(([k,v])=>`<option value="${k}">${k} ×${v} — ${ITEMS[k]}</option>`).join('')}</select></p>
  <p id="fprev" class="card"></p><p id="ferr" style="color:var(--bad)"></p>
  <button onclick="forge()">Forge spell</button><button onclick="screenHub()">Back</button></div>`;prev();
}
function forgeSpell(){return buildSpell($('fk').value,+$('fp').value+($('fc').value==='Star Dust'?2:0),$('fd').value,$('fc').value)}
function buildSpell(k,t,d,c){const m=S.g.mult,h=c==='Ancient Rune'?.5:1;
  const s={name:'',kind:k,power:Math.round({dmg:12,heal:12,shield:12,dot:5}[k]*t*0.75*m+8),cost:4+t*4,cd:1,recoil:0,cur:0};
  if(c==='Ember Core')s.power=Math.round(s.power*1.2);
  if(d==='recoil')s.recoil=Math.round(t*3.5*h);if(d==='cd')s.cd=1+Math.ceil((1+t/2)*h);
  if(d==='burn')s.cost=Math.round(s.cost*(1+.7*h));if(d==='exhaust')s.exhaust=1;
  if(c==='Mana Shard')s.cost=Math.round(s.cost*.7);return s;
}
function prev(){$('fpv').textContent=$('fp').value;$('fprev').innerHTML='Preview: '+desc(forgeSpell())}
function forge(){
  const n=$('fn').value.trim().replace(/\s+/g,' ');
  if(!/^[A-Za-z ]{3,24}$/.test(n))return $('ferr').textContent='Name must be 3–24 letters.';
  if(BANNED.test(n))return $('ferr').textContent='Please choose a family-friendly name.';
  if(!S.forgePts)return $('ferr').textContent='You need a Forge point (earned every 3 levels).';if(S.g.spells.length>=16)return $('ferr').textContent='Your grimoire is full (16 spells).';
  const s=forgeSpell(),c=$('fc').value;s.name=n;if(c)S.inv[c]--;S.g.spells.push(s);S.forgePts--;fixLoad();if(S.load.length<5)S.load.push(S.g.spells.length-1);save();screenHub();
}

// ---------- COMBAT (2D pixel platformer) ----------
const FOES=['Goblin','Wraith','Golem','Harpy','Basilisk','Shade','Troll','Wyrm','Lich','Behemoth','Slime','Spider Queen','Mimic','Fire Imp','Frost Giant'];
const TRAITS={armored:'Armored: takes 30% less damage',regen:'Regenerates HP over time',drain:'Steals 6 mana per hit',swift:'Moves twice as fast',enrage:'Hits harder over time'};
const ITEMS={'Mana Shard':'Catalyst: spell costs 30% less mana','Ember Core':'Catalyst: +20% spell power','Ancient Rune':'Catalyst: drawback is halved','Star Dust':'Catalyst: +2 power tiers above your cap'};
const EL_COL={Fire:'#ff6a3d',Water:'#3da5ff',Ice:'#9ee7ff',Lightning:'#ffe14d',Plant:'#5fd068',Shadow:'#a070ff',Light:'#fff3b0',Poison:'#a6e22e',Lava:'#ff4500',Star:'#ffd700',Moon:'#d8d8ff',Spirit:'#e0b0ff',Wind:'#bdf5d0',Earth:'#b08850',Metal:'#c0c8d0',Sound:'#ff9ad5',Time:'#e8d38a',Space:'#7a6cff',Crystal:'#8ff0ff',Sand:'#e6c47a',Mist:'#cfd8e0',Gravity:'#9b59b6',Bubble:'#a8e0ff',Paper:'#f5f0e0',Thread:'#ff8080',Ash:'#9a9a9a',Glass:'#d0f0ff',Storm:'#6080ff',Bone:'#eee8d0',Ink:'#5050a0'};
const elc=()=>EL_COL[S.g.el]||'#c9a54a';
function bar(v,m,c){return`<div class="bar"><i style="width:${Math.max(0,Math.min(100,v/m*100))}%;background:${c}"></i></div>`}
const SPR={me:["..hhhh..",".hhhhhh.","hhhbhhhh","..ssss..","..eses..","..ssss..",".rrrrrr.","rrrrrrbb",".rrrrrbb",".rrrrrr.","..r..r..",".kk..kk."],
 blob:["..oooo..",".oooooo.","owwoowwo","obwoobwo","oooooooo","oooooooo",".o.oo.o.","o..oo..o"]};
function spr(c,a,x,y,map,col,s,flip){for(let r=0;r<a.length;r++)for(let q=0;q<8;q++){const ch=a[r][flip?7-q:q];if(ch!=='.'){c.fillStyle=map[ch]||col;c.fillRect(Math.round(x+q*s),Math.round(y+r*s),s,s)}}}
const T=16,W=320,H=180,keys={};let G=null;
addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;const k=e.key.toLowerCase();keys[k]=1;if(!G)return;
  if([' ','arrowup','arrowdown'].includes(k))e.preventDefault();
  if(G.mode==='fight'){const n=e.code.startsWith('Digit')?+e.code.slice(5):0;if(n>=1&&n<=8&&!e.repeat)G.chg={i:n-1,t:performance.now()};
    if(k==='escape')leave();if(k==='f'||k==='j')melee();if(k==='q'&&has('Mana Armor')){G.armor=!G.armor;say('Mana Armor '+(G.armor?'ON':'off'))}
    if(k==='r')field()}
  else{if(k==='e'||k==='arrowdown')interact();if(k==='escape')app.innerHTML=''}});
document.querySelectorAll('#touch [data-k]').forEach(b=>{const k=b.dataset.k;b.onpointerdown=()=>keys[k]=1;b.onpointerup=b.onpointerleave=()=>keys[k]=0});
const busy=()=>app.childElementCount>0;
const STATIONS=[{x:4,name:'Trial Shrine',go:()=>screenStart()},{x:11,name:'Grimoire Lectern',need:1,go:()=>screenHub()},
  {x:18,name:'Spell Forge',need:1,go:()=>screenForge()},{x:22,name:'Spell Sage',need:1,go:()=>screenSage()},{x:26,name:'Wave Portal',need:1,go:()=>startFight()}];
function nearStation(){return G&&G.mode==='town'&&STATIONS.find(s=>Math.abs(G.p.x+4-(s.x*T+8))<20)}
function interact(){if(busy())return;const s=nearStation();if(!s)return;if(s.need&&!S)return say('Take the Trial at the shrine first!');s.go()}
function startTown(){
  const cols=32,grid=[];for(let x=0;x<cols;x++){const c=new Array(12).fill(0);for(let y=9;y<12;y++)c[y]=1;grid.push(c)}
  G={mode:'town',grid,cols,en:[],sc:1,p:{x:S?11*T:2*T,y:0,vx:0,vy:0,w:8,h:12,dir:1,on:0,inv:0},hp:1,mp:0,sh:0,exh:0,proj:[],pops:[],gcd:0,msgs:[],
     banner:S?'':'Walk to the Trial Shrine and press E',bT:S?0:600,t:0,acc:0,last:performance.now(),running:1,c:$('cv').getContext('2d')};
  $('ttl').textContent='Town of Beginnings';$('hud').innerHTML='<div id="hs"></div>';
  $('help').innerHTML='Move ←/→ or A/D · Jump Space/W/↑ · Use a building: walk up to it and press E (or ↓ / Act) · Esc closes menus';
  updHud();const g=G;requestAnimationFrame(t=>loop(t,g));
}
function drawStation(c,s,x,y,t){const ec=S?elc():'#c9a54a';
  if(s.x===4){c.fillStyle='#8a8aa0';c.fillRect(x-6,y-30,4,30);c.fillRect(x+18,y-30,4,30);c.fillRect(x-8,y-34,32,4);c.fillStyle=t%40<20?'#e0d0ff':'#b090ff';c.fillRect(x+4,y-20,8,8)}
  if(s.x===11){c.fillStyle='#6b4a2b';c.fillRect(x+6,y-14,4,14);c.fillRect(x,y-18,16,4);c.fillStyle=ec;c.fillRect(x+2,y-22,12,4)}
  if(s.x===18){c.fillStyle='#333';c.fillRect(x-2,y-10,20,4);c.fillRect(x+4,y-6,8,6);c.fillStyle=['#ff6a3d','#ffb020','#ffe14d'][Math.floor(t/8)%3];c.fillRect(x+20,y-8-(t%16<8?2:0),6,8)}
  if(s.x===22){spr(c,SPR.me,x+4,y-12,{h:'#ddd',s:'#f1c27d',e:'#000',k:'#222',b:'#fff'},'#556',1,false);c.fillStyle='#ffd700';c.font='8px monospace';if(t%60<40)c.fillText('?',x+14,y-16)}
  if(s.x===26){for(let a=0;a<24;a++){const r=a/24*6.283+t/30;c.fillStyle=a%2?'#a070ff':'#5a3aa0';c.fillRect(x+6+Math.cos(r)*10,y-18+Math.sin(r)*16,3,3)}}
  c.font='8px monospace';c.textAlign='center';c.fillStyle='#ece8f5';c.fillText(s.name,x+8,y-40);c.textAlign='left'}
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0;if(e.key==='Shift')keys.shift=0;
  if(G&&G.mode==='fight'&&G.chg&&e.code==='Digit'+(G.chg.i+1)){const o=has('Overcharge')&&performance.now()-G.chg.t>=600,i=G.chg.i;G.chg=null;cast(i,o)}});

function startFight(){
  const w=S.wave,sc=Math.pow(1.18,w-1),boss=w%5===0,r=rng(w*7919+S.g.seed),cols=60+w*4,grid=[],tk=Object.keys(TRAITS);
  let h=3;
  while(grid.length<cols){const x=grid.length,col=new Array(12).fill(0);
    if(x>8&&x<cols-14&&r()<.08){grid.push(col);if(r()<.5)grid.push(new Array(12).fill(0));continue}
    if(x>4&&r()<.25)h=Math.max(2,Math.min(5,h+(r()<.5?-1:1)));for(let y=12-h;y<12;y++)col[y]=1;grid.push(col)}
  for(let x=12;x<cols-16;x+=7+Math.floor(r()*6)){const top=grid[x].indexOf(1),y=(top<0?9:top)-3-Math.floor(r()*2);if(y>=2)for(let i=0;i<3;i++)grid[x+i][y]=1}
  const en=[],n=4+w;
  function spawn(cx,b){const fi=(w-1+en.length)%FOES.length,tr=w<3?[]:(b||r()<.4+w*.03)?[tk[Math.floor(r()*5)]]:[];
    if(b&&w>=10)tr.push(tk[(tk.indexOf(tr[0])+1)%5]);
    en.push({name:(b?'Boss ':'')+FOES[fi],col:`hsl(${fi*47%360},65%,55%)`,boss:b,tr,x:cx*T,y:0,w:b?16:8,h:b?16:8,vx:(r()<.5?-1:1)*(tr.includes('swift')?1:.5),vy:0,
      hp:Math.round((b?150:25)*sc),atk:Math.round((b?14:8)*sc),dot:0,dotT:0})}
  for(let i=0;i<n;i++)spawn(14+Math.floor((cols-30)*i/n+r()*3),false);
  if(boss)spawn(cols-9,true);
  en.forEach(e=>e.hpMax=e.hp);
  const fc=cols-3;
  G={mode:'fight',sp:(fixLoad(),S.load.map(i=>S.g.spells[i])),field:0,fieldCd:0,mel:0,swing:0,still:0,armor:false,enh:false,chg:null,grid,cols,en,sc,boss,p:{x:24,y:0,vx:0,vy:0,w:8,h:12,dir:1,on:0,inv:0},hp:S.hpMax,mp:S.mpMax,sh:0,exh:0,proj:[],pops:[],gcd:0,
     msgs:[],banner:'',bT:0,flagX:fc*T,flagY:grid[fc].indexOf(1)*T,lastSafe:24,t:0,acc:0,last:performance.now(),running:1};

  let fx=Object.keys(SAGE_FX).filter(k=>SAGE_FX[k].test(t));const notes=[];
  if(fx.includes('freeze'))fx=fx.filter(f=>f!=='slow');
  if(fx.includes('pull')&&fx.includes('push'))return{msg:'A spell cannot both pull and push. Choose one and ask again.'};
  if((kind==='heal'||kind==='shield')&&fx.length){notes.push(`${kind==='heal'?'Healing':'Shield'} magic cannot carry ${fx.join('/')} effects, so I left them out.`);fx=[]}
  if(fx.length>3)return{msg:`That is too many effects for one spell (${fx.join(', ')}). The limit is 3. Simplify it and ask again.`};
  const cap=4+Math.floor(S.lv/2);let tier=3+(/strong|powerful|mighty|devastat|ultimate/.test(t)?2:0)-(/weak|small|tiny|light/.test(t)?1:0);
  if(tier>cap){notes.push(`At level ${S.lv} I can only weave power tier ${cap}.`);tier=cap}tier=Math.max(1,tier);
  const other=Object.keys(ELEMENTS).find(el=>el!==S.g.el&&new RegExp('\\b'+el.toLowerCase()).test(t));
  if(other)notes.push(`Your grimoire channels ${S.g.el} magic, not ${other}, so I will shape it as ${S.g.el}.`);
  let d=/recoil|hurt (me|myself)|self.?damage|backfire/.test(t)?'recoil':/cooldown|recharge|long wait/.test(t)?'cd':/expensive|costly|lots of mana|more mana/.test(t)?'burn':/exhaust|tired/.test(t)?'exhaust':null;
  if(!d){d=['recoil','cd','burn','exhaust'][(tier+fx.length)%4];notes.push('Every spell needs a drawback, so I picked one for you.')}
  const s=buildSpell(kind,tier,d,'');s.fx=fx;s.src='forge';if(fx.length){s.cost=Math.round(s.cost*(1+.25*fx.length));s.power=Math.round(s.power*(1-.08*fx.length))}
  return{ok:1,spell:s,msg:'Yes, that is possible! '+notes.join(' ')+' It would work like this: '+desc(s)+'.'}}
let sageLog=[],sagePending=null;
function screenSage(){if(!S)return;
  app.innerHTML=`<h1>Spell Sage</h1><div class="card">${sageLog.map(x=>`<p>${x}</p>`).join('')||'<p>🧙 <i>"Describe the spell you dream of and I will tell you whether your grimoire can hold it. I understand effects like pierce, freeze, slow, pull, push, drain, multi, fast and big, plus heals, shields and curses. Name a drawback if you like."</i></p>'}</div>
  <textarea id="sq" rows="2" maxlength="200" style="width:100%;background:#0e0c14;color:var(--ink);border:1px solid #453d5e;border-radius:6px;padding:6px;font:inherit" placeholder="e.g. a strong beam that pierces and slows enemies"></textarea>
  <button onclick="sageAsk()">Ask the Sage</button><button onclick="sageLog=[];sagePending=null;app.innerHTML=''">Leave</button>
  ${sagePending?`<div class="card">Name it: <input id="sn" maxlength="24"> <button onclick="sageForge()">Forge it (1 Forge point, you have ${S.forgePts})</button><p id="serr" style="color:var(--bad)"></p></div>`:''}`}
function sageAsk(){const q=$('sq').value.trim();if(!q)return;const r=sageParse(q);sageLog.push('🗨️ <b>You:</b> '+esc(q),'🧙 <b>Sage:</b> '+r.msg);sageLog=sageLog.slice(-8);sagePending=r.ok?r.spell:null;screenSage()}
function sageForge(){const n=$('sn').value.trim().replace(/\s+/g,' '),er=m=>$('serr').textContent=m;
  if(!/^[A-Za-z ]{3,24}$/.test(n))return er('Name must be 3–24 letters.');if(BANNED.test(n))return er('Please choose a family-friendly name.');
  if(!S.forgePts)return er('You need a Forge point (earned every 3 levels).');if(S.g.spells.length>=16)return er('Your grimoire is full (16 spells).');
  const s=sagePending;s.name=n;S.g.spells.push(s);S.forgePts--;fixLoad();if(S.load.length<5)S.load.push(S.g.spells.length-1);save();
  sageLog.push('🧙 <b>Sage:</b> "'+esc(n)+'" is now written in your grimoire!');sagePending=null;screenSage()}
function applyHit(q,e){const f=q.fx,dir=G.p.x<e.x?1:-1;
  if(q.dot){e.dot=q.dmg;e.dotT=180;pop(e,'cursed','#a6e22e')}
  else{const d=Math.round(q.dmg*(0.9+Math.random()*.2));hurt(e,d);if(f.includes('drain')){const h=Math.max(1,Math.round(d*.3));G.hp=Math.min(S.hpMax,G.hp+h);pop(G.p,'+'+h,'#4caf7d')}}
  if(f.includes('freeze')){e.frz=120;pop(e,'frozen','#9ee7ff')}else if(f.includes('slow'))e.slw=240;
  const k=f.includes('pull')?-24:f.includes('push')?24:0;if(k){e.x+=dir*k;if(box(e))e.x-=dir*k}}
if(S)S.inv=S.inv||{};
startTown();
